<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Job Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#5b6270;--line:#e3e6eb;--accent:#0b5fff;--new:#0a7f4f;--warn:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a21;--text:#e8eaee;--muted:#9aa3b2;--line:#262b35;--accent:#6ea0ff;--new:#4cc38a;--warn:#f0a85a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.controls input,.controls select{flex:1 1 160px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
.controls label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.job{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.job a.t{color:var(--accent);font-weight:600;text-decoration:none;font-size:16px}
.job a.t:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:8px;vertical-align:middle;border:1px solid var(--new);color:var(--new)}
.score{float:right;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
h2{font-size:16px;margin:28px 0 6px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--accent);text-decoration:none}
.status{font-size:13px;color:var(--muted)}
.status .bad{color:var(--warn)}
.empty{color:var(--muted);padding:20px 0;text-align:center}
</style>
</head>
<body>
<main>
<h1>Security Job Tracker</h1>
<p class="sub" id="sub"></p>
<div class="controls">
  <input id="q" type="search" placeholder="Search title or location" aria-label="Search">
  <select id="co" aria-label="Company"></select>
  <label><input id="newonly" type="checkbox"> New only</label>
</div>
<div id="list"></div>
<h2>Check these directly</h2>
<p class="sub">No feed this tracker can read. Each link opens a pre-filtered search.</p>
<div class="links" id="links"></div>
<h2>Source status</h2>
<div class="status" id="status"></div>
</main>
<script>
const DATA = {"generated": "2026-10-25 08:40 UTC", "jobs": [{"key": "NVIDIA:JR2026874", "company": "NVIDIA", "title": "Cyber Security Engineer", "location": "3 Locations", "url": "https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite/job/India-Pune/Cyber-Security-Engineer_JR2026874", "posted": "Posted 4 Days Ago", "summary": "", "score": 46, "reasons": ["title: security engineer", "multiple locations, check", "priority company"], "first_seen": "2026-10-22 08:52 UTC"}, {"key": "NVIDIA:JR2021887", "company": "NVIDIA", "title": "Security Research Engineer, AI Safety and Security Engineering", "location": "6 Locations", "url": "https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite/job/US-CA-Santa-Clara/Security-Research-Engineer--AI-Safety-and-Security-Engineering_JR2021887", "posted": "Posted 5 Days Ago", "summary": "", "score": 46, "reasons": ["title: security engineer", "multiple locations, check", "priority company"], "first_seen": "2026-10-21 08:50 UTC"}, {"key": "NVIDIA:JR2026525", "company": "NVIDIA", "title": "Security Engineer, GPU Kernel Driver", "location": "2 Locations", "url": "https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite/job/US-CA-Santa-Clara/Security-Engineer--GPU-Kernel-Driver_JR2026525", "posted": "Posted 26 Days Ago", "summary": "", "score": 46, "reasons": ["title: security engineer", "multiple locations, check", "priority company"], "first_seen": "2026-10-11 16:27 UTC"}, {"key": "NVIDIA:JR2021886", "company": "NVIDIA", "title": "Harness and Platform Engineer, AI Safety and Security Engineering", "location": "6 Locations", "url": "https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite/job/US-CA-Santa-Clara/Harness-and-Platform-Engineer--AI-Safety-and-Security-Engineering_JR2021886", "posted": "Posted 5 Days Ago", "summary": "", "score": 46, "reasons": ["title: security engineer", "multiple locations, check", "priority company"], "first_seen": "2026-10-21 08:50 UTC"}], "new_keys": [], "links": [{"name": "Microsoft", "url": "https://jobs.careers.microsoft.com/global/en/search?q=security%20analyst&lc=India&l=en_us&pg=1&pgSz=20&o=Recent"}, {"name": "Google", "url": "https://www.google.com/about/careers/applications/jobs/results/?q=security%20analyst&location=India"}, {"name": "Meta", "url": "https://www.metacareers.com/jobs?q=security%20analyst"}, {"name": "IBM", "url": "https://www.ibm.com/careers/search?q=security%20analyst&field_keyword_05[0]=India"}, {"name": "Apple", "url": "https://jobs.apple.com/en-in/search?search=security%20analyst&sort=newest"}, {"name": "Accenture", "url": "https://www.accenture.com/in-en/careers/jobsearch?jk=security%20analyst&sb=1"}, {"name": "Oracle", "url": "https://careers.oracle.com/jobs/#en/sites/jobsearch/requisitions?keyword=security%20analyst&location=India"}, {"name": "Capgemini", "url": "https://www.capgemini.com/careers/join-capgemini/job-search/?search=security%20analyst&country_code=en-in"}], "status": {"Amazon": {"ok": true, "fetched": 191, "matched": 0}, "NVIDIA": {"ok": true, "fetched": 167, "matched": 4}, "Adobe": {"ok": true, "fetched": 83, "matched": 0}, "Salesforce": {"ok": true, "fetched": 121, "matched": 0}, "Dell": {"ok": false, "error": "422 Client Error: Unprocessable Entity for url: https://dell.wd1.myworkdayjobs.com/wday/cxs/dell/External/jobs"}, "Intel": {"ok": true, "fetched": 122, "matched": 0}, "Qualcomm": {"ok": false, "error": "422 Client Error: Unprocessable Entity for url: https://qualcomm.wd5.myworkdayjobs.com/wday/cxs/qualcomm/External/jobs"}, "Mastercard": {"ok": true, "fetched": 158, "matched": 0}, "PayPal": {"ok": true, "fetched": 100, "matched": 0}, "Walmart": {"ok": false, "error": "422 Client Error: Unprocessable Entity for url: https://walmart.wd5.myworkdayjobs.com/wday/cxs/walmart/WalmartExternal/j"}, "Cloudflare": {"ok": true, "fetched": 454, "matched": 0}, "Datadog": {"ok": true, "fetched": 433, "matched": 0}, "Okta": {"ok": true, "fetched": 390, "matched": 0}}};
const $ = id => document.getElementById(id);
function el(tag, cls, text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
const jobs = DATA.jobs.slice().sort((a,b)=>b.score-a.score);
const newCut = DATA.new_keys ? new Set(DATA.new_keys) : new Set();

$('sub').textContent = jobs.length + ' matches · updated ' + DATA.generated;

const co = $('co');
co.appendChild(new Option('All companies',''));
[...new Set(jobs.map(j=>j.company))].sort().forEach(c=>co.appendChild(new Option(c,c)));

function render(){
  const q = $('q').value.toLowerCase(), c = co.value, n = $('newonly').checked;
  const list = $('list'); list.replaceChildren();
  const shown = jobs.filter(j =>
    (!c || j.company===c) &&
    (!n || newCut.has(j.key)) &&
    (!q || (j.title+' '+j.location).toLowerCase().includes(q)));
  if(!shown.length){list.appendChild(el('div','empty','No matches for these filters.'));return}
  shown.forEach(j=>{
    const card = el('div','job');
    card.appendChild(el('span','score',String(j.score)));
    const a = el('a','t',j.title); a.href=j.url; a.target='_blank'; a.rel='noopener';
    card.appendChild(a);
    if(newCut.has(j.key)) card.appendChild(el('span','badge','NEW'));
    const bits=[j.company, j.location||'location n/a'];
    if(j.posted) bits.push(j.posted);
    card.appendChild(el('div','meta',bits.join(' · ')));
    if(j.reasons&&j.reasons.length){
      const chips=el('div','chips');
      j.reasons.forEach(r=>chips.appendChild(el('span','chip',r)));
      card.appendChild(chips);
    }
    list.appendChild(card);
  });
}
['q','co','newonly'].forEach(id=>$(id).addEventListener('input',render));
render();

DATA.links.forEach(l=>{const a=el('a','',l.name);a.href=l.url;a.target='_blank';a.rel='noopener';$('links').appendChild(a)});

const st = $('status');
Object.entries(DATA.status).forEach(([name,s])=>{
  const row = el('div');
  if(s.ok){row.textContent = name+': ok, '+s.fetched+' fetched, '+s.matched+' matched'}
  else{row.className='bad';row.textContent = name+': failed ('+s.error+'), showing earlier results'}
  st.appendChild(row);
});
</script>
</body>
</html>
